name: release_document_template

on:
  push:
    branches:
      - "main"
    paths:
      - "zuydfacilitymanagement/**"
  workflow_dispatch:

permissions:
  contents: write # REQUIRED for creating releases

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate timestamp
        id: ts
        run: echo "value=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Zip directory
        id: zip
        run: |
          DIR="zuydfacilitymanagement"
          ZIP_NAME="${DIR}-${{ steps.ts.outputs.value }}.zip"
          zip -r "$ZIP_NAME" "$DIR"
          echo "name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ts.outputs.value }}" \
            "${{ steps.zip.outputs.name }}" \
            --title "Release ${{ steps.ts.outputs.value }}" \
            --notes "Automated release"
