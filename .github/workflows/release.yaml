name: release_document_template

on:
  push:
    branches:
      - "main"
    paths:
      - "zuydfacilitymanagement/**"
  workflow_dispatch:

permissions:
  contents: write # REQUIRED for creating releases

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get timestamp
        id: ts
        run: echo "timestamp=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Zip directory
        run: |
          DIR="zuydfacilitymanagement"
          ZIP_NAME="${DIR}-${{ steps.ts.outputs.timestamp }}.zip"
          zip -r "$ZIP_NAME" "$DIR"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # Modern method using GitHub CLI
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ts.outputs.timestamp }}" \
            "${{ steps.ts.outputs.zip_name }}" \
            --title "Release ${{ steps.ts.outputs.timestamp }}" \
            --notes "Automated release"
